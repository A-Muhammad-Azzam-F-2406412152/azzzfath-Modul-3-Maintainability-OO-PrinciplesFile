<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Payment Detail</title>
</head>
<body>
<h2>Manage Payment</h2>
<div th:if="${payment != null}">
    <p><strong>Payment ID:</strong> <span th:text="${payment.id}"></span></p>
    <p><strong>Method:</strong> <span th:text="${payment.method}"></span></p>
    <p><strong>Status:</strong> <span th:text="${payment.status}"></span></p>

    <form th:action="@{/payment/admin/set-status/{id}(id=${payment.id})}" method="post">
        <button type="submit" name="status" value="SUCCESS">Accept</button>
        <button type="submit" name="status" value="REJECTED">Reject</button>
    </form>
</div>
<a th:href="@{/payment/admin/list}">Back to List</a>
</body>
</html>
